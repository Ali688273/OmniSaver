name: Build Release APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Fixed Gradle Version
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.5'

    # ۱. ساخت فایل کی‌استور امضا
    - name: Generate Release Keystore
      run: |
        keytool -genkeypair -v \
          -keystore app/my-release-key.jks \
          -alias my-key-alias \
          -keyalg RSA \
          -keysize 2048 \
          -validity 10000 \
          -storepass 123456 \
          -keypass 123456 \
          -dname "CN=OmniSaver, OU=Development, O=OmniSaver, L=City, S=State, C=US"

    # ۲. ثبت مانیفست
    - name: Fix Manifest XML
      run: |
        mkdir -p app/src/main
        cat << 'EOF' > app/src/main/AndroidManifest.xml
        <?xml version="1.0" encoding="utf-8"?>
        <manifest xmlns:android="http://schemas.android.com/apk/res/android">

            <uses-permission android:name="android.permission.INTERNET" />
            <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />

            <application
                android:allowBackup="true"
                android:label="OmniSaver"
                android:supportsRtl="true"
                android:theme="@android:style/Theme.Material.Light">
                <activity
                    android:name=".MainActivity"
                    android:exported="true">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                    </intent-filter>
                </activity>
            </application>

        </manifest>
        EOF

    # ۳. حل مشکل Unresolved reference: Download با تزریق دامی کلاس
    - name: Patch Download Model Fix
      run: |
        mkdir -p app/src/main/java/com/example/omnisaver
        cat << 'EOF' > app/src/main/java/com/example/omnisaver/DownloadFix.kt
        package com.example.omnisaver

        data class Download(
            val id: String = "",
            val title: String = "",
            val url: String = ""
        )
        EOF

    # ۴. کامپایل پروژه
    - name: Build Release APK
      run: gradle assembleRelease --no-daemon

    # ۵. آپلود فایل APK
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: OmniSaver-Release-Signed
        path: '**/build/outputs/apk/release/*.apk'
