name: Build Release APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Fixed Gradle Version
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.5'

    # ۱. تنظیم حافظه RAM گرادل
    - name: Set Gradle Memory Limit
      run: |
        mkdir -p ~/.gradle
        echo "org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m" >> ~/.gradle/gradle.properties

    # ۲. ساخت کی‌استور اختصاصی
    - name: Generate Keystore for Store
      run: |
        mkdir -p app
        rm -f app/my-release-key.jks my-release-key.jks
        keytool -genkeypair -v \
          -keystore app/my-release-key.jks \
          -alias omni-key-alias \
          -keyalg RSA \
          -keysize 2048 \
          -validity 10000 \
          -storepass android123 \
          -keypass android123 \
          -dname "CN=Video Downloader, OU=App, O=VideoDownloader, L=Tehran, S=Tehran, C=IR"
        
        cp app/my-release-key.jks my-release-key.jks || true

    # ۳. تنظیم مانیفست
    - name: Fix Manifest XML
      run: |
        mkdir -p app/src/main
        cat << 'EOF' > app/src/main/AndroidManifest.xml
        <?xml version="1.0" encoding="utf-8"?>
        <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.INTERNET" />
            <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
            <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="28" />
            <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />
            <uses-permission android:name="android.permission.DOWNLOAD_WITHOUT_NOTIFICATION" />

            <application
                android:allowBackup="true"
                android:label="دانلود کننده ویدیو"
                android:icon="@drawable/ic_launcher_foreground"
                android:supportsRtl="true"
                android:usesCleartextTraffic="true"
                android:theme="@android:style/Theme.Material.Light.NoActionBar">
                <activity
                    android:name=".MainActivity"
                    android:configChanges="orientation|screenSize|keyboardHidden"
                    android:exported="true">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                    </intent-filter>
                </activity>
            </application>
        </manifest>
        EOF

    # ۴. آیکون برنامه
    - name: Inject App Icon
      run: |
        mkdir -p app/src/main/res/drawable
        cat << 'EOF' > app/src/main/res/drawable/ic_launcher_foreground.xml
        <vector xmlns:android="http://schemas.android.com/apk/res/android"
            android:width="108dp"
            android:height="108dp"
            android:viewportWidth="108"
            android:viewportHeight="108">
            <path android:fillColor="#0F172A" android:pathData="M0,0h108v108h-108z"/>
            <path android:fillColor="#2563EB" android:pathData="M54,20 A34,34 0 1,0 88,54 A34,34 0 0,0 54,20 Z" />
            <path android:fillColor="#10B981" android:pathData="M44,40 L64,40 L64,56 L72,56 L54,76 L36,56 L44,56 Z" />
        </vector>
        EOF

    # ۵. کد اصلاح شده دانلودر با مدیریت کامل تمام فایل‌ها و نمایش وضعیت‌ها
    - name: Inject Fixed Complete Download Engine Code
      run: |
        mkdir -p app/src/main/java/com/example/omnisaver
        cat << 'EOF' > app/src/main/java/com/example/omnisaver/MainActivity.kt
        package com.example.omnisaver

        import android.app.DownloadManager
        import android.content.Context
        import android.content.Intent
        import android.database.Cursor
        import android.net.Uri
        import android.os.Bundle
        import android.os.Environment
        import android.webkit.CookieManager
        import android.webkit.DownloadListener
        import android.webkit.WebResourceRequest
        import android.webkit.WebResourceResponse
        import android.webkit.WebView
        import android.webkit.WebViewClient
        import android.widget.Toast
        import androidx.activity.ComponentActivity
        import androidx.activity.compose.BackHandler
        import androidx.activity.compose.setContent
        import androidx.compose.foundation.background
        import androidx.compose.foundation.border
        import androidx.compose.foundation.clickable
        import androidx.compose.foundation.layout.*
        import androidx.compose.foundation.lazy.grid.GridCells
        import androidx.compose.foundation.lazy.grid.LazyVerticalGrid
        import androidx.compose.foundation.lazy.grid.items
        import androidx.compose.foundation.lazy.LazyColumn
        import androidx.compose.foundation.lazy.items
        import androidx.compose.foundation.shape.CircleShape
        import androidx.compose.foundation.shape.RoundedCornerShape
        import androidx.compose.material3.*
        import androidx.compose.runtime.*
        import androidx.compose.runtime.saveable.rememberSaveable
        import androidx.compose.ui.Alignment
        import androidx.compose.ui.Modifier
        import androidx.compose.ui.graphics.Color
        import androidx.compose.ui.platform.LocalContext
        import androidx.compose.ui.text.font.FontWeight
        import androidx.compose.ui.text.style.TextOverflow
        import androidx.compose.ui.unit.dp
        import androidx.compose.ui.unit.sp
        import androidx.compose.ui.viewinterop.AndroidView
        import kotlinx.coroutines.delay

        data class TabItem(
            val id: Int,
            var title: String = "صفحه جدید",
            var url: String = "https://www.google.com",
            var webView: WebView? = null
        )

        data class DownloadItemInfo(
            val id: Long,
            val title: String,
            val progress: Int,
            val downloadedBytes: Long,
            val totalBytes: Long,
            val status: Int,
            val localUri: String?
        )

        class MainActivity : ComponentActivity() {
            override fun onCreate(savedInstanceState: Bundle?) {
                super.onCreate(savedInstanceState)
                setContent {
                    MainApp()
                }
            }
        }

        @Composable
        fun MainApp() {
            var currentBottomTab by rememberSaveable { mutableStateOf(0) }
            val tabs = remember { mutableStateListOf(TabItem(id = 1)) }
            var activeTabId by remember { mutableStateOf(1) }
            var nextTabId by remember { mutableStateOf(2) }
            var isTabOverviewOpen by remember { mutableStateOf(false) }

            val activeTab = tabs.find { it.id == activeTabId } ?: tabs.firstOrNull()

            BackHandler(enabled = isTabOverviewOpen || currentBottomTab != 0 || (activeTab?.webView?.canGoBack() == true)) {
                if (isTabOverviewOpen) {
                    isTabOverviewOpen = false
                } else if (currentBottomTab != 0) {
                    currentBottomTab = 0
                } else if (activeTab?.webView?.canGoBack() == true) {
                    activeTab.webView?.goBack()
                }
            }

            Scaffold(
                bottomBar = {
                    NavigationBar(containerColor = Color(0xFF0F172A)) {
                        NavigationBarItem(
                            selected = currentBottomTab == 0,
                            onClick = {
                                currentBottomTab = 0
                                isTabOverviewOpen = false
                            },
                            label = { Text("مرورگر", color = Color.White) },
                            icon = { Text("🌐", fontSize = 20.sp) }
                        )
                        NavigationBarItem(
                            selected = currentBottomTab == 1,
                            onClick = { currentBottomTab = 1 },
                            label = { Text("دانلودها", color = Color.White) },
                            icon = { Text("📥", fontSize = 20.sp) }
                        )
                        NavigationBarItem(
                            selected = currentBottomTab == 2,
                            onClick = { currentBottomTab = 2 },
                            label = { Text("تنظیمات", color = Color.White) },
                            icon = { Text("⚙️", fontSize = 20.sp) }
                        )
                    }
                }
            ) { padding ->
                Box(modifier = Modifier.padding(padding)) {
                    when (currentBottomTab) {
                        0 -> BrowserTabsScreen(
                            tabs = tabs,
                            activeTabId = activeTabId,
                            isTabOverviewOpen = isTabOverviewOpen,
                            onToggleTabOverview = { isTabOverviewOpen = !isTabOverviewOpen },
                            onTabSelected = {
                                activeTabId = it
                                isTabOverviewOpen = false
                            },
                            onNewTab = {
                                val newId = nextTabId++
                                tabs.add(TabItem(id = newId))
                                activeTabId = newId
                                isTabOverviewOpen = false
                            },
                            onCloseTab = { tabId ->
                                if (tabs.size > 1) {
                                    val index = tabs.indexOfFirst { it.id == tabId }
                                    tabs.removeIf { it.id == tabId }
                                    if (activeTabId == tabId) {
                                        activeTabId = tabs.getOrNull(index.coerceAtMost(tabs.size - 1))?.id ?: tabs.first().id
                                    }
                                } else {
                                    tabs[0].url = "https://www.google.com"
                                    tabs[0].title = "صفحه جدید"
                                    tabs[0].webView?.loadUrl("https://www.google.com")
                                    isTabOverviewOpen = false
                                }
                            }
                        )
                        1 -> DownloadsTrackerScreen()
                        2 -> SettingsScreen()
                    }
                }
            }
        }

        @OptIn(ExperimentalMaterial3Api::class)
        @Composable
        fun BrowserTabsScreen(
            tabs: List<TabItem>,
            activeTabId: Int,
            isTabOverviewOpen: Boolean,
            onToggleTabOverview: () -> Unit,
            onTabSelected: (Int) -> Unit,
            onNewTab: () -> Unit,
            onCloseTab: (Int) -> Unit
        ) {
            val context = LocalContext.current
            val activeTab = tabs.find { it.id == activeTabId } ?: tabs.first()

            var urlInput by remember(activeTabId) { mutableStateOf(activeTab.url) }
            var detectedVideoUrl by remember { mutableStateOf<String?>(null) }
            var isEyeActive by remember { mutableStateOf(false) }

            if (isTabOverviewOpen) {
                Column(
                    modifier = Modifier
                        .fillMaxSize()
                        .background(Color(0xFF0F172A))
                        .padding(16.dp)
                ) {
                    Row(
                        modifier = Modifier.fillMaxWidth(),
                        horizontalArrangement = Arrangement.SpaceBetween,
                        verticalAlignment = Alignment.CenterVertically
                    ) {
                        Text(
                            text = "صفحات باز (${tabs.size})",
                            color = Color.White,
                            fontSize = 20.sp,
                            fontWeight = FontWeight.Bold
                        )
                        Button(
                            onClick = onNewTab,
                            colors = ButtonDefaults.buttonColors(containerColor = Color(0xFF2563EB))
                        ) {
                            Text("+ صفحه جدید", color = Color.White)
                        }
                    }

                    Spacer(modifier = Modifier.height(16.dp))

                    LazyVerticalGrid(
                        columns = GridCells.Fixed(2),
                        horizontalArrangement = Arrangement.spacedBy(12.dp),
                        verticalArrangement = Arrangement.spacedBy(12.dp),
                        modifier = Modifier.weight(1f)
                    ) {
                        items(tabs) { tab ->
                            val isSelected = tab.id == activeTabId
                            Card(
                                modifier = Modifier
                                    .fillMaxWidth()
                                    .height(160.dp)
                                    .border(
                                        width = if (isSelected) 3.dp else 1.dp,
                                        color = if (isSelected) Color(0xFF2563EB) else Color.Gray,
                                        shape = RoundedCornerShape(12.dp)
                                    )
                                    .clickable { onTabSelected(tab.id) },
                                colors = CardDefaults.cardColors(containerColor = Color(0xFF1E293B))
                            ) {
                                Column(modifier = Modifier.padding(8.dp)) {
                                    Row(
                                        modifier = Modifier.fillMaxWidth(),
                                        horizontalArrangement = Arrangement.SpaceBetween,
                                        verticalAlignment = Alignment.CenterVertically
                                    ) {
                                        Text(
                                            text = tab.title,
                                            color = Color.White,
                                            fontSize = 12.sp,
                                            fontWeight = FontWeight.Bold,
                                            maxLines = 1,
                                            overflow = TextOverflow.Ellipsis,
                                            modifier = Modifier.weight(1f)
                                        )
                                        IconButton(
                                            onClick = { onCloseTab(tab.id) },
                                            modifier = Modifier.size(24.dp)
                                        ) {
                                            Text("×", color = Color.Red, fontSize = 16.sp, fontWeight = FontWeight.Bold)
                                        }
                                    }
                                    Spacer(modifier = Modifier.height(8.dp))
                                    Box(
                                        modifier = Modifier
                                            .fillMaxSize()
                                            .background(Color(0xFF334155), RoundedCornerShape(6.dp))
                                            .padding(6.dp),
                                        contentAlignment = Alignment.Center
                                    ) {
                                        Text(
                                            text = tab.url,
                                            color = Color.LightGray,
                                            fontSize = 10.sp,
                                            maxLines = 4,
                                            overflow = TextOverflow.Ellipsis
                                        )
                                    }
                                }
                            }
                        }
                    }
                }
            } else {
                Scaffold(
                    topBar = {
                        Row(
                            modifier = Modifier
                                .fillMaxWidth()
                                .background(Color(0xFF0F172A))
                                .padding(8.dp),
                            verticalAlignment = Alignment.CenterVertically
                        ) {
                            OutlinedTextField(
                                value = urlInput,
                                onValueChange = { urlInput = it },
                                modifier = Modifier.weight(1f),
                                placeholder = { Text("جستجو یا ورود آدرس...") },
                                singleLine = true,
                                shape = RoundedCornerShape(12.dp),
                                colors = OutlinedTextFieldDefaults.colors(
                                    focusedContainerColor = Color.White,
                                    unfocusedContainerColor = Color.White
                                )
                            )
                            Spacer(modifier = Modifier.width(6.dp))
                            Button(
                                onClick = {
                                    val target = if (!urlInput.startsWith("http")) "https://www.google.com/search?q=$urlInput" else urlInput
                                    activeTab.url = target
                                    activeTab.webView?.loadUrl(target)
                                },
                                shape = RoundedCornerShape(12.dp)
                            ) {
                                Text("برو")
                            }
                            Spacer(modifier = Modifier.width(6.dp))

                            Box(
                                modifier = Modifier
                                    .size(38.dp)
                                    .border(2.dp, Color.White, RoundedCornerShape(8.dp))
                                    .clickable { onToggleTabOverview() },
                                contentAlignment = Alignment.Center
                            ) {
                                Text(
                                    text = "${tabs.size}",
                                    color = Color.White,
                                    fontSize = 14.sp,
                                    fontWeight = FontWeight.Bold
                                )
                            }
                        }
                    },
                    floatingActionButton = {
                        FloatingActionButton(
                            onClick = {
                                if (isEyeActive && detectedVideoUrl != null) {
                                    startDownload(context, detectedVideoUrl!!, "Video_${System.currentTimeMillis()}.mp4")
                                } else {
                                    Toast.makeText(context, "ویدیو را پخش کنید تا دکمه روشن شود", Toast.LENGTH_SHORT).show()
                                }
                            },
                            containerColor = if (isEyeActive) Color(0xFF10B981) else Color(0xFF64748B),
                            contentColor = Color.White,
                            shape = CircleShape
                        ) {
                            Text(if (isEyeActive) "👁 دانلود" else "👁", fontSize = 16.sp, fontWeight = FontWeight.Bold)
                        }
                    }
                ) { padding ->
                    Box(
                        modifier = Modifier
                            .fillMaxSize()
                            .padding(padding)
                    ) {
                        tabs.forEach { tab ->
                            val isVisible = tab.id == activeTabId
                            Box(modifier = Modifier.fillMaxSize(), contentAlignment = Alignment.Center) {
                                AndroidView(
                                    modifier = Modifier.fillMaxSize(),
                                    factory = { ctx ->
                                        WebView(ctx).apply {
                                            settings.javaScriptEnabled = true
                                            settings.domStorageEnabled = true
                                            settings.mediaPlaybackRequiresUserGesture = false
                                            settings.userAgentString = "Mozilla/5.0 (Linux; Android 10; Mobile) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/119.0.0.0 Mobile Safari/537.36"

                                            // شنود لینک‌های دانلود (بازی‌ها، فایل‌های zip و مستقیم)
                                            setDownloadListener(DownloadListener { url, userAgent, contentDisposition, mimetype, contentLength ->
                                                val fileName = Uri.parse(url).lastPathSegment ?: "File_${System.currentTimeMillis()}"
                                                startDownload(ctx, url, fileName)
                                            })

                                            webViewClient = object : WebViewClient() {
                                                override fun shouldInterceptRequest(
                                                    view: WebView?,
                                                    request: WebResourceRequest?
                                                ): WebResourceResponse? {
                                                    val reqUrl = request?.url?.toString()?.lowercase() ?: ""
                                                    val isRealVideo = (reqUrl.endsWith(".mp4") || 
                                                                      reqUrl.endsWith(".m3u8") || 
                                                                      reqUrl.endsWith(".webm") || 
                                                                      reqUrl.endsWith(".mov") || 
                                                                      reqUrl.endsWith(".mkv") || 
                                                                      (reqUrl.contains("/video/") && !reqUrl.contains("json") && !reqUrl.contains("metrica")))

                                                    if (isRealVideo) {
                                                        if (isVisible) {
                                                            detectedVideoUrl = request?.url?.toString()
                                                            isEyeActive = true
                                                        }
                                                    }
                                                    return super.shouldInterceptRequest(view, request)
                                                }

                                                override fun onPageFinished(view: WebView?, url: String?) {
                                                    super.onPageFinished(view, url)
                                                    if (url != null) {
                                                        tab.url = url
                                                        tab.title = view?.title ?: "صفحه جدید"
                                                        if (isVisible) {
                                                            urlInput = url
                                                        }
                                                    }
                                                }
                                            }
                                            loadUrl(tab.url)
                                            tab.webView = this
                                        }
                                    },
                                    update = { view ->
                                        if (!isVisible) {
                                            view.visibility = android.view.View.GONE
                                        } else {
                                            view.visibility = android.view.View.VISIBLE
                                            urlInput = tab.url
                                        }
                                    }
                                )
                            }
                        }
                    }
                }
            }
        }

        @Composable
        fun DownloadsTrackerScreen() {
            val context = LocalContext.current
            var downloadList by remember { mutableStateOf<List<DownloadItemInfo>>(emptyList()) }

            LaunchedEffect(Unit) {
                while (true) {
                    downloadList = getAllDownloads(context)
                    delay(1000)
                }
            }

            Column(
                modifier = Modifier
                    .fillMaxSize()
                    .padding(16.dp)
            ) {
                Text("مدیریت و لیست کلیه دانلودها", fontSize = 18.sp, fontWeight = FontWeight.Bold)
                Spacer(modifier = Modifier.height(12.dp))

                if (downloadList.isEmpty()) {
                    Box(modifier = Modifier.fillMaxSize(), contentAlignment = Alignment.Center) {
                        Text("هیچ فایلی هنوز دانلود نشده است", color = Color.Gray, fontSize = 14.sp)
                    }
                } else {
                    LazyColumn(verticalArrangement = Arrangement.spacedBy(8.dp)) {
                        items(downloadList) { item ->
                            Card(
                                modifier = Modifier.fillMaxWidth(),
                                colors = CardDefaults.cardColors(containerColor = Color(0xFFF8FAFC))
                            ) {
                                Column(modifier = Modifier.padding(12.dp)) {
                                    Text(item.title, fontWeight = FontWeight.Bold, maxLines = 1, overflow = TextOverflow.Ellipsis)
                                    Spacer(modifier = Modifier.height(6.dp))
                                    
                                    val statusText = when (item.status) {
                                        DownloadManager.STATUS_SUCCESSFUL -> "تکمیل شده ✅"
                                        DownloadManager.STATUS_FAILED -> "خطا در دانلود ❌"
                                        DownloadManager.STATUS_PAUSED -> "متوقف شده ⏸"
                                        else -> "در حال دریافت (${item.progress}%) ⏳"
                                    }

                                    LinearProgressIndicator(
                                        progress = if (item.status == DownloadManager.STATUS_SUCCESSFUL) 1f else (item.progress / 100f),
                                        modifier = Modifier.fillMaxWidth().height(8.dp),
                                        color = if (item.status == DownloadManager.STATUS_SUCCESSFUL) Color(0xFF10B981) else Color(0xFF2563EB)
                                    )
                                    
                                    Spacer(modifier = Modifier.height(6.dp))
                                    Row(
                                        modifier = Modifier.fillMaxWidth(),
                                        horizontalArrangement = Arrangement.SpaceBetween,
                                        verticalAlignment = Alignment.CenterVertically
                                    ) {
                                        val downloadedMB = String.format("%.1f", item.downloadedBytes / (1024f * 1024f))
                                        val totalMB = String.format("%.1f", item.totalBytes / (1024f * 1024f))
                                        
                                        Column {
                                            Text(statusText, fontSize = 12.sp, fontWeight = FontWeight.Bold)
                                            Text("$downloadedMB MB از $totalMB MB", fontSize = 11.sp, color = Color.Gray)
                                        }
                                        
                                        if (item.status == DownloadManager.STATUS_SUCCESSFUL && !item.localUri.isNullOrEmpty()) {
                                            Button(
                                                onClick = {
                                                    try {
                                                        val intent = Intent(Intent.ACTION_VIEW).apply {
                                                            setDataAndType(Uri.parse(item.localUri), "*/*")
                                                            flags = Intent.FLAG_ACTIVITY_NEW_TASK or Intent.FLAG_GRANT_READ_URI_PERMISSION
                                                        }
                                                        context.startActivity(intent)
                                                    } catch (e: Exception) {
                                                        Toast.makeText(context, "برنامه‌ای برای باز کردن فایل پیدا نشد", Toast.LENGTH_SHORT).show()
                                                    }
                                                },
                                                contentPadding = PaddingValues(horizontal = 10.dp, vertical = 4.dp),
                                                shape = RoundedCornerShape(8.dp)
                                            ) {
                                                Text("باز کردن فایل", fontSize = 11.sp)
                                            }
                                        } else {
                                            Text(
                                                text = "حذف",
                                                color = Color.Red,
                                                fontSize = 12.sp,
                                                fontWeight = FontWeight.Bold,
                                                modifier = Modifier.clickable {
                                                    cancelDownload(context, item.id)
                                                }
                                            )
                                        }
                                    }
                                }
                            }
                        }
                    }
                }
            }
        }

        @Composable
        fun SettingsScreen() {
            var selectedEngine by remember { mutableStateOf("گوگل") }
            val context = LocalContext.current

            Column(
                modifier = Modifier
                    .fillMaxSize()
                    .padding(16.dp)
            ) {
                Text("تنظیمات دانلود کننده ویدیو", fontSize = 20.sp, fontWeight = FontWeight.Bold)
                Spacer(modifier = Modifier.height(20.dp))

                Text("موتور جستجو:", fontWeight = FontWeight.SemiBold)
                Row(verticalAlignment = Alignment.CenterVertically) {
                    RadioButton(selected = selectedEngine == "گوگل", onClick = { selectedEngine = "گوگل" })
                    Text("Google")
                    Spacer(modifier = Modifier.width(16.dp))
                    RadioButton(selected = selectedEngine == "بینگ", onClick = { selectedEngine = "بینگ" })
                    Text("Bing")
                }

                Divider(modifier = Modifier.padding(vertical = 16.dp))

                Button(
                    onClick = {
                        Toast.makeText(context, "حافظه کش پاکسازی شد", Toast.LENGTH_SHORT).show()
                    },
                    colors = ButtonDefaults.buttonColors(containerColor = Color(0xFFEF4444)),
                    modifier = Modifier.fillMaxWidth()
                ) {
                    Text("پاکسازی کش مرورگر")
                }
            }
        }

        fun startDownload(context: Context, downloadUrl: String, filename: String) {
            try {
                val cookies = CookieManager.getInstance().getCookie(downloadUrl)
                val request = DownloadManager.Request(Uri.parse(downloadUrl)).apply {
                    setTitle(filename)
                    setDescription("در حال دانلود فایل...")
                    if (!cookies.isNullOrEmpty()) {
                        addRequestHeader("Cookie", cookies)
                    }
                    addRequestHeader("User-Agent", "Mozilla/5.0 (Linux; Android 10; Mobile) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/119.0.0.0 Mobile Safari/537.36")
                    setNotificationVisibility(DownloadManager.Request.VISIBILITY_VISIBLE_NOTIFY_COMPLETED)
                    setDestinationInExternalPublicDir(Environment.DIRECTORY_DOWNLOADS, filename)
                }
                val manager = context.getSystemService(Context.DOWNLOAD_SERVICE) as DownloadManager
                manager.enqueue(request)
                Toast.makeText(context, "دانلود شروع شد! وضعیت را در تب دانلودها ببینید", Toast.LENGTH_LONG).show()
            } catch (e: Exception) {
                Toast.makeText(context, "خطا در شروع دانلود: ${e.message}", Toast.LENGTH_SHORT).show()
            }
        }

        fun getAllDownloads(context: Context): List<DownloadItemInfo> {
            val list = mutableListOf<DownloadItemInfo>()
            val manager = context.getSystemService(Context.DOWNLOAD_SERVICE) as DownloadManager
            val query = DownloadManager.Query()
            val cursor: Cursor? = manager.query(query)

            cursor?.use { c ->
                val idIdx = c.getColumnIndex(DownloadManager.COLUMN_ID)
                val titleIdx = c.getColumnIndex(DownloadManager.COLUMN_TITLE)
                val downloadedIdx = c.getColumnIndex(DownloadManager.COLUMN_BYTES_DOWNLOADED_SO_FAR)
                val totalIdx = c.getColumnIndex(DownloadManager.COLUMN_TOTAL_SIZE_BYTES)
                val statusIdx = c.getColumnIndex(DownloadManager.COLUMN_STATUS)
                val localUriIdx = c.getColumnIndex(DownloadManager.COLUMN_LOCAL_URI)

                while (c.moveToNext()) {
                    val id = c.getLong(idIdx)
                    val title = c.getString(titleIdx) ?: "فایل دانلود شده"
                    val downloaded = c.getLong(downloadedIdx)
                    val total = c.getLong(totalIdx)
                    val status = c.getInt(statusIdx)
                    val localUri = if (localUriIdx != -1) c.getString(localUriIdx) else null

                    val progress = if (total > 0) ((downloaded * 100) / total).toInt() else 0
                    list.add(DownloadItemInfo(id, title, progress, downloaded, total, status, localUri))
                }
            }
            return list.reversed()
        }

        fun cancelDownload(context: Context, downloadId: Long) {
            val manager = context.getSystemService(Context.DOWNLOAD_SERVICE) as DownloadManager
            manager.remove(downloadId)
            Toast.makeText(context, "دانلود حذف شد", Toast.LENGTH_SHORT).show()
        }
        EOF

    # ۶. تنظیم کلید امضا
    - name: Override Keystore Credentials in Gradle
      run: |
        if [ -f "app/build.gradle.kts" ]; then
          sed -i 's/storePassword = .*/storePassword = "android123"/g' app/build.gradle.kts || true
          sed -i 's/keyPassword = .*/keyPassword = "android123"/g' app/build.gradle.kts || true
          sed -i 's/keyAlias = .*/keyAlias = "omni-key-alias"/g' app/build.gradle.kts || true
        elif [ -f "app/build.gradle" ]; then
          sed -i 's/storePassword .*/storePassword "android123"/g' app/build.gradle || true
          sed -i 's/keyPassword .*/keyPassword "android123"/g' app/build.gradle || true
          sed -i 's/keyAlias .*/keyAlias "omni-key-alias"/g' app/build.gradle || true
        fi

    # ۷. ساخت فایل APK
    - name: Build Release APK
      run: gradle assembleRelease --no-daemon

    # ۸. آپلود فایل APK خروجی
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: VideoDownloader-Release
        path: '**/build/outputs/apk/release/*.apk'
