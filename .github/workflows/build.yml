name: Debug Manifest Issue

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    # پیدا کردن همه فایل‌های مانیفست و چاپ محتوای آن‌ها در لاگ
    - name: Print All Manifest Files
      run: |
        echo "=== LIST OF ALL MANIFEST FILES ==="
        find . -name "AndroidManifest.xml"
        
        echo "=== SHOWING CONTENT OF MANIFEST FILES ==="
        find . -name "AndroidManifest.xml" -exec echo "--- FILE: {} ---" \; -exec cat {} \;
