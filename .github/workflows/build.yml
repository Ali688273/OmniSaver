name: Build Release APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Fixed Gradle Version
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.5'

    - name: Generate Release Keystore
      run: |
        keytool -genkeypair -v \
          -keystore app/my-release-key.jks \
          -alias my-key-alias \
          -keyalg RSA \
          -keysize 2048 \
          -validity 10000 \
          -storepass 123456 \
          -keypass 123456 \
          -dname "CN=OmniSaver, OU=Development, O=OmniSaver, L=City, S=State, C=US"

    # ۱. تزریق مستقیم آیکون برنامه
    - name: Inject Modern App Icon
      run: |
        mkdir -p app/src/main/res/drawable
        cat << 'EOF' > app/src/main/res/drawable/ic_launcher_foreground.xml
        <vector xmlns:android="http://schemas.android.com/apk/res/android"
            android:width="108dp"
            android:height="108dp"
            android:viewportWidth="108"
            android:viewportHeight="108">
            <path
                android:fillColor="#0D1B2A"
                android:pathData="M0,0h108v108h-108z"/>
            <path
                android:fillColor="#1E88E5"
                android:pathData="M54,20 A34,34 0 1,0 88,54 A34,34 0 0,0 54,20 Z" />
            <path
                android:fillColor="#00E676"
                android:pathData="M44,40 L64,40 L64,56 L72,56 L54,76 L36,56 L44,56 Z" />
        </vector>
        EOF

    # ۲. ثبت مانیفست همراه آیکون
    - name: Fix Manifest XML
      run: |
        mkdir -p app/src/main
        cat << 'EOF' > app/src/main/AndroidManifest.xml
        <?xml version="1.0" encoding="utf-8"?>
        <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.INTERNET" />
            <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
            <application
                android:allowBackup="true"
                android:label="OmniSaver"
                android:icon="@drawable/ic_launcher_foreground"
                android:supportsRtl="true"
                android:theme="@android:style/Theme.Material.Light">
                <activity
                    android:name=".MainActivity"
                    android:exported="true">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                    </intent-filter>
                </activity>
            </application>
        </manifest>
        EOF

    # ۳. حذف کامل خطوط آیکون‌های مفقود از کد کاتلین
    - name: Clean Missing Icon Statements
      run: |
        find app/src/main/java -name "MainActivity.kt" -exec sed -i '/Icon(Icons\./d' {} \;

    # ۴. کامپایل نهایی
    - name: Build Release APK
      run: gradle assembleRelease --no-daemon

    # ۵. خروجی نهایی
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: OmniSaver-Release-Signed
        path: '**/build/outputs/apk/release/*.apk'
