name: Build Release APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    # ساخت خودکار کلید امضا برای بازار و مایکت
    - name: Generate Release Keystore
      run: |
        keytool -genkeypair -v -keystore my-release-key.jks -keyalg RSA -keysize 2048 -validity 10000 -alias my-alias -storepass mypassword -keypass mypassword -dname "CN=OmniSaver, OU=App, O=Dev, L=City, S=State, C=IR"

    - name: Build Release APK
      run: gradle assembleRelease

    # امضا کردن خروجی
    - name: Sign APK
      uses: rsoftware/sign-android-apk@v1
      with:
        releaseDirectory: app/build/outputs/apk/release
        signingKeyBase64: ${{ secrets.SIGNING_KEY }}
        alias: my-alias
        keyStorePassword: mypassword
        keyPassword: mypassword
      continue-on-error: true

    - name: Upload Signed APK
      uses: actions/upload-artifact@v4
      with:
        name: OmniSaver-Release-Signed
        path: app/build/outputs/apk/release/*.apk
