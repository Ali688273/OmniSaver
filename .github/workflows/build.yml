name: Build Release APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    # اصلاح مانیفست در تمام مسیرهای احتمالی پروژه
    - name: Fix Manifest Path
      run: |
        find . -name "AndroidManifest.xml" -exec rm -f {} +
        mkdir -p OmniSaver/app/src/main
        mkdir -p app/src/main
        
        MANIFEST_CONTENT='<?xml version="1.0" encoding="utf-8"?>
        <manifest xmlns:android="http://schemas.android.com/apk/android">
            <uses-permission android:name="android.permission.INTERNET" />
            <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
            <application
                android:allowBackup="true"
                android:label="OmniSaver"
                android:supportsRtl="true"
                android:theme="@style/Theme.Material3.DayNight">
                <activity
                    android:name=".MainActivity"
                    android:exported="true">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                    </intent-filter>
                </activity>
            </application>
        </manifest>'

        echo "$MANIFEST_CONTENT" > OmniSaver/app/src/main/AndroidManifest.xml
        echo "$MANIFEST_CONTENT" > app/src/main/AndroidManifest.xml

    - name: Generate Release Keystore
      run: |
        keytool -genkeypair -v -keystore OmniSaver/app/my-release-key.jks -keyalg RSA -keysize 2048 -validity 10000 -alias my-alias -storepass mypassword -keypass mypassword -dname "CN=OmniSaver, OU=App, O=Dev, L=City, S=State, C=IR" || true
        keytool -genkeypair -v -keystore app/my-release-key.jks -keyalg RSA -keysize 2048 -validity 10000 -alias my-alias -storepass mypassword -keypass mypassword -dname "CN=OmniSaver, OU=App, O=Dev, L=City, S=State, C=IR" || true

    - name: Build Signed Release APK
      run: gradle assembleRelease

    - name: Upload Signed APK
      uses: actions/upload-artifact@v4
      with:
        name: OmniSaver-Release-Signed
        path: '**/build/outputs/apk/release/*.apk'
