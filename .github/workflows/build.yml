name: Build Release APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Fixed Gradle Version
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.5'

    # ۱. تنظیم حافظه RAM گرادل
    - name: Set Gradle Memory Limit
      run: |
        mkdir -p ~/.gradle
        echo "org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m" >> ~/.gradle/gradle.properties

    # ۲. ساخت دقیق کی‌استور با نام Alias دقیق مورد انتظار پروژه (my-alias)
    - name: Generate Release Keystore
      run: |
        mkdir -p app
        keytool -genkeypair -v \
          -keystore app/my-release-key.jks \
          -alias my-alias \
          -keyalg RSA \
          -keysize 2048 \
          -validity 10000 \
          -storepass android \
          -keypass android \
          -dname "CN=OmniSaver, OU=Development, O=OmniSaver, L=City, S=State, C=US"
        
        cp app/my-release-key.jks my-release-key.jks || true

    # ۳. تزریق کتابخانه آیکون‌های متریال
    - name: Add Material Icons Dependency
      run: |
        if [ -f "app/build.gradle.kts" ]; then
          echo 'dependencies { implementation("androidx.compose.material:material-icons-extended:1.6.0") }' >> app/build.gradle.kts
        elif [ -f "app/build.gradle" ]; then
          echo 'dependencies { implementation "androidx.compose.material:material-icons-extended:1.6.0" }' >> app/build.gradle
        fi

    # ۴. تنظیم دقیق پسوورد و آلیس در کانفیگ پروژه
    - name: Override Keystore Credentials
      run: |
        if [ -f "app/build.gradle.kts" ]; then
          sed -i 's/storePassword = .*/storePassword = "android"/g' app/build.gradle.kts || true
          sed -i 's/keyPassword = .*/keyPassword = "android"/g' app/build.gradle.kts || true
          sed -i 's/keyAlias = .*/keyAlias = "my-alias"/g' app/build.gradle.kts || true
        elif [ -f "app/build.gradle" ]; then
          sed -i 's/storePassword .*/storePassword "android"/g' app/build.gradle || true
          sed -i 's/keyPassword .*/keyPassword "android"/g' app/build.gradle || true
          sed -i 's/keyAlias .*/keyAlias "my-alias"/g' app/build.gradle || true
        fi

    # ۵. تزریق آیکون اختصاصی
    - name: Inject Modern App Icon
      run: |
        mkdir -p app/src/main/res/drawable
        cat << 'EOF' > app/src/main/res/drawable/ic_launcher_foreground.xml
        <vector xmlns:android="http://schemas.android.com/apk/res/android"
            android:width="108dp"
            android:height="108dp"
            android:viewportWidth="108"
            android:viewportHeight="108">
            <path
                android:fillColor="#0D1B2A"
                android:pathData="M0,0h108v108h-108z"/>
            <path
                android:fillColor="#1E88E5"
                android:pathData="M54,20 A34,34 0 1,0 88,54 A34,34 0 0,0 54,20 Z" />
            <path
                android:fillColor="#00E676"
                android:pathData="M44,40 L64,40 L64,56 L72,56 L54,76 L36,56 L44,56 Z" />
        </vector>
        EOF

    # ۶. تنظیم مانیفست
    - name: Fix Manifest XML
      run: |
        mkdir -p app/src/main
        cat << 'EOF' > app/src/main/AndroidManifest.xml
        <?xml version="1.0" encoding="utf-8"?>
        <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.INTERNET" />
            <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
            <application
                android:allowBackup="true"
                android:label="OmniSaver"
                android:icon="@drawable/ic_launcher_foreground"
                android:supportsRtl="true"
                android:theme="@android:style/Theme.Material.Light">
                <activity
                    android:name=".MainActivity"
                    android:exported="true">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                    </intent-filter>
                </activity>
            </application>
        </manifest>
        EOF

    # ۷. ساخت APK
    - name: Build Release APK
      run: gradle assembleRelease --no-daemon

    # ۸. دانلود خروجی
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: OmniSaver-Release-Signed
        path: '**/build/outputs/apk/release/*.apk'
