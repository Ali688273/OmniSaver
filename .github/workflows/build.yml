name: Build Release APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Fixed Gradle Version
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.5'

    # ۱. تنظیم حافظه RAM گرادل
    - name: Set Gradle Memory Limit
      run: |
        mkdir -p ~/.gradle
        echo "org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m" >> ~/.gradle/gradle.properties

    # ۲. ساخت کی‌استور اختصاصی
    - name: Generate Keystore for Store
      run: |
        mkdir -p app
        rm -f app/my-release-key.jks my-release-key.jks
        keytool -genkeypair -v \
          -keystore app/my-release-key.jks \
          -alias omni-key-alias \
          -keyalg RSA \
          -keysize 2048 \
          -validity 10000 \
          -storepass android123 \
          -keypass android123 \
          -dname "CN=OmniSaver Store, OU=App, O=OmniSaver, L=Tehran, S=Tehran, C=IR"
        
        cp app/my-release-key.jks my-release-key.jks || true

    # ۳. تنظیم دسترسی‌های مانیفست
    - name: Fix Manifest XML
      run: |
        mkdir -p app/src/main
        cat << 'EOF' > app/src/main/AndroidManifest.xml
        <?xml version="1.0" encoding="utf-8"?>
        <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.INTERNET" />
            <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
            <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="28" />
            <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />

            <application
                android:allowBackup="true"
                android:label="OmniSaver Pro"
                android:icon="@drawable/ic_launcher_foreground"
                android:supportsRtl="true"
                android:usesCleartextTraffic="true"
                android:theme="@android:style/Theme.Material.Light.NoActionBar">
                <activity
                    android:name=".MainActivity"
                    android:configChanges="orientation|screenSize|keyboardHidden"
                    android:exported="true">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                    </intent-filter>
                </activity>
            </application>
        </manifest>
        EOF

    # ۴. تزریق آیکون برنامه
    - name: Inject App Icon
      run: |
        mkdir -p app/src/main/res/drawable
        cat << 'EOF' > app/src/main/res/drawable/ic_launcher_foreground.xml
        <vector xmlns:android="http://schemas.android.com/apk/res/android"
            android:width="108dp"
            android:height="108dp"
            android:viewportWidth="108"
            android:viewportHeight="108">
            <path android:fillColor="#0F172A" android:pathData="M0,0h108v108h-108z"/>
            <path android:fillColor="#2563EB" android:pathData="M54,20 A34,34 0 1,0 88,54 A34,34 0 0,0 54,20 Z" />
            <path android:fillColor="#10B981" android:pathData="M44,40 L64,40 L64,56 L72,56 L54,76 L36,56 L44,56 Z" />
        </vector>
        EOF

    # ۵. تزریق کد کامل فیلتر ویدیو و دانلود کیفیت اصلی
    - name: Inject Smart Video Extractor Code
      run: |
        mkdir -p app/src/main/java/com/example/omnisaver
        cat << 'EOF' > app/src/main/java/com/example/omnisaver/MainActivity.kt
        package com.example.omnisaver

        import android.app.DownloadManager
        import android.content.Context
        import android.content.Intent
        import android.net.Uri
        import android.os.Bundle
        import android.os.Environment
        import android.webkit.CookieManager
        import android.webkit.WebResourceRequest
        import android.webkit.WebResourceResponse
        import android.webkit.WebView
        import android.webkit.WebViewClient
        import android.widget.Toast
        import androidx.activity.ComponentActivity
        import androidx.activity.compose.BackHandler
        import androidx.activity.compose.setContent
        import androidx.compose.foundation.background
        import androidx.compose.foundation.clickable
        import androidx.compose.foundation.horizontalScroll
        import androidx.compose.foundation.layout.*
        import androidx.compose.foundation.rememberScrollState
        import androidx.compose.foundation.shape.CircleShape
        import androidx.compose.foundation.shape.RoundedCornerShape
        import androidx.compose.material3.*
        import androidx.compose.runtime.*
        import androidx.compose.runtime.saveable.rememberSaveable
        import androidx.compose.ui.Alignment
        import androidx.compose.ui.Modifier
        import androidx.compose.ui.graphics.Color
        import androidx.compose.ui.platform.LocalContext
        import androidx.compose.ui.text.font.FontWeight
        import androidx.compose.ui.text.style.TextOverflow
        import androidx.compose.ui.unit.dp
        import androidx.compose.ui.unit.sp
        import androidx.compose.ui.viewinterop.AndroidView

        data class TabItem(
            val id: Int,
            var title: String = "صفحه جدید",
            var url: String = "https://www.google.com",
            var webView: WebView? = null
        )

        class MainActivity : ComponentActivity() {
            override fun onCreate(savedInstanceState: Bundle?) {
                super.onCreate(savedInstanceState)
                setContent {
                    MainApp()
                }
            }
        }

        @Composable
        fun MainApp() {
            var currentBottomTab by rememberSaveable { mutableStateOf(0) }
            val tabs = remember { mutableStateListOf(TabItem(id = 1)) }
            var activeTabId by remember { mutableStateOf(1) }
            var nextTabId by remember { mutableStateOf(2) }

            val activeTab = tabs.find { it.id == activeTabId } ?: tabs.firstOrNull()

            BackHandler(enabled = currentBottomTab != 0 || (activeTab?.webView?.canGoBack() == true)) {
                if (currentBottomTab != 0) {
                    currentBottomTab = 0
                } else if (activeTab?.webView?.canGoBack() == true) {
                    activeTab.webView?.goBack()
                }
            }

            Scaffold(
                bottomBar = {
                    NavigationBar(containerColor = Color(0xFF0F172A)) {
                        NavigationBarItem(
                            selected = currentBottomTab == 0,
                            onClick = { currentBottomTab = 0 },
                            label = { Text("مرورگر", color = Color.White) },
                            icon = { Text("🌐", fontSize = 20.sp) }
                        )
                        NavigationBarItem(
                            selected = currentBottomTab == 1,
                            onClick = { currentBottomTab = 1 },
                            label = { Text("دانلودها", color = Color.White) },
                            icon = { Text("📥", fontSize = 20.sp) }
                        )
                        NavigationBarItem(
                            selected = currentBottomTab == 2,
                            onClick = { currentBottomTab = 2 },
                            label = { Text("تنظیمات", color = Color.White) },
                            icon = { Text("⚙️", fontSize = 20.sp) }
                        )
                    }
                }
            ) { padding ->
                Box(modifier = Modifier.padding(padding)) {
                    when (currentBottomTab) {
                        0 -> BrowserTabsScreen(
                            tabs = tabs,
                            activeTabId = activeTabId,
                            onTabSelected = { activeTabId = it },
                            onNewTab = {
                                val newId = nextTabId++
                                tabs.add(TabItem(id = newId))
                                activeTabId = newId
                            },
                            onCloseTab = { tabId ->
                                if (tabs.size > 1) {
                                    val index = tabs.indexOfFirst { it.id == tabId }
                                    tabs.removeIf { it.id == tabId }
                                    if (activeTabId == tabId) {
                                        activeTabId = tabs.getOrNull(index.coerceAtMost(tabs.size - 1))?.id ?: tabs.first().id
                                    }
                                } else {
                                    tabs[0].url = "https://www.google.com"
                                    tabs[0].title = "صفحه جدید"
                                    tabs[0].webView?.loadUrl("https://www.google.com")
                                }
                            }
                        )
                        1 -> DownloadsScreen()
                        2 -> SettingsScreen()
                    }
                }
            }
        }

        @OptIn(ExperimentalMaterial3Api::class)
        @Composable
        fun BrowserTabsScreen(
            tabs: List<TabItem>,
            activeTabId: Int,
            onTabSelected: (Int) -> Unit,
            onNewTab: () -> Unit,
            onCloseTab: (Int) -> Unit
        ) {
            val context = LocalContext.current
            val activeTab = tabs.find { it.id == activeTabId } ?: tabs.first()

            var urlInput by remember(activeTabId) { mutableStateOf(activeTab.url) }
            var detectedVideoUrl by remember { mutableStateOf<String?>(null) }
            var isEyeActive by remember { mutableStateOf(false) }

            Scaffold(
                topBar = {
                    Column(
                        modifier = Modifier
                            .fillMaxWidth()
                            .background(Color(0xFF0F172A))
                    ) {
                        Row(
                            modifier = Modifier
                                .fillMaxWidth()
                                .padding(horizontal = 4.dp, vertical = 4.dp),
                            verticalAlignment = Alignment.CenterVertically
                        ) {
                            Row(
                                modifier = Modifier
                                    .weight(1f)
                                    .horizontalScroll(rememberScrollState()),
                                verticalAlignment = Alignment.CenterVertically
                            ) {
                                tabs.forEach { tab ->
                                    val isSelected = tab.id == activeTabId
                                    Surface(
                                        shape = RoundedCornerShape(8.dp),
                                        color = if (isSelected) Color(0xFF2563EB) else Color(0xFF1E293B),
                                        modifier = Modifier
                                            .padding(end = 4.dp)
                                            .clickable { onTabSelected(tab.id) }
                                    ) {
                                        Row(
                                            modifier = Modifier.padding(horizontal = 8.dp, vertical = 6.dp),
                                            verticalAlignment = Alignment.CenterVertically
                                        ) {
                                            Text(
                                                text = tab.title,
                                                color = Color.White,
                                                fontSize = 12.sp,
                                                maxLines = 1,
                                                overflow = TextOverflow.Ellipsis,
                                                modifier = Modifier.widthIn(max = 90.dp)
                                            )
                                            Spacer(modifier = Modifier.width(4.dp))
                                            Text(
                                                text = "×",
                                                color = Color.LightGray,
                                                fontSize = 14.sp,
                                                fontWeight = FontWeight.Bold,
                                                modifier = Modifier
                                                    .padding(2.dp)
                                                    .clickable { onCloseTab(tab.id) }
                                            )
                                        }
                                    }
                                }
                            }

                            IconButton(
                                onClick = onNewTab,
                                modifier = Modifier.size(36.dp)
                            ) {
                                Text("+", color = Color.White, fontSize = 22.sp, fontWeight = FontWeight.Bold)
                            }
                        }

                        Row(
                            modifier = Modifier
                                .fillMaxWidth()
                                .padding(8.dp),
                            verticalAlignment = Alignment.CenterVertically
                        ) {
                            OutlinedTextField(
                                value = urlInput,
                                onValueChange = { urlInput = it },
                                modifier = Modifier.weight(1f),
                                placeholder = { Text("جستجو یا ورود آدرس...") },
                                singleLine = true,
                                shape = RoundedCornerShape(12.dp),
                                colors = OutlinedTextFieldDefaults.colors(
                                    focusedContainerColor = Color.White,
                                    unfocusedContainerColor = Color.White
                                )
                            )
                            Spacer(modifier = Modifier.width(8.dp))
                            Button(
                                onClick = {
                                    val target = if (!urlInput.startsWith("http")) "https://www.google.com/search?q=$urlInput" else urlInput
                                    activeTab.url = target
                                    activeTab.webView?.loadUrl(target)
                                },
                                shape = RoundedCornerShape(12.dp)
                            ) {
                                Text("برو")
                            }
                        }
                    }
                },
                floatingActionButton = {
                    FloatingActionButton(
                        onClick = {
                            if (isEyeActive && detectedVideoUrl != null) {
                                // دانلود مستقیم کیفیت اصلی ویدیو بدون گیر دادن به فایلهای متنی
                                startDownload(context, detectedVideoUrl!!)
                            } else {
                                Toast.makeText(context, "ویدیو را پخش کنید تا دکمه دانلود روشن شود", Toast.LENGTH_SHORT).show()
                            }
                        },
                        containerColor = if (isEyeActive) Color(0xFF10B981) else Color(0xFF64748B),
                        contentColor = Color.White,
                        shape = CircleShape
                    ) {
                        Text(if (isEyeActive) "👁 دانلود" else "👁", fontSize = 16.sp, fontWeight = FontWeight.Bold)
                    }
                }
            ) { padding ->
                Box(
                    modifier = Modifier
                        .fillMaxSize()
                        .padding(padding)
                ) {
                    tabs.forEach { tab ->
                        val isVisible = tab.id == activeTabId
                        Box(modifier = Modifier.fillMaxSize(), contentAlignment = Alignment.Center) {
                            AndroidView(
                                modifier = Modifier.fillMaxSize(),
                                factory = { ctx ->
                                    WebView(ctx).apply {
                                        settings.javaScriptEnabled = true
                                        settings.domStorageEnabled = true
                                        settings.mediaPlaybackRequiresUserGesture = false

                                        webViewClient = object : WebViewClient() {
                                            override fun shouldInterceptRequest(
                                                view: WebView?,
                                                request: WebResourceRequest?
                                            ): WebResourceResponse? {
                                                val reqUrl = request?.url?.toString()?.lowercase() ?: ""
                                                
                                                // تشخیص واقعی ویدیوها و فیلتر کردن کدهای آمارگیری متنی
                                                val isRealVideo = (reqUrl.endsWith(".mp4") || 
                                                                  reqUrl.endsWith(".m3u8") || 
                                                                  reqUrl.endsWith(".webm") || 
                                                                  reqUrl.endsWith(".mov") || 
                                                                  reqUrl.endsWith(".mkv") || 
                                                                  (reqUrl.contains("/video/") && !reqUrl.contains("json") && !reqUrl.contains("metrica")))

                                                if (isRealVideo) {
                                                    if (isVisible) {
                                                        detectedVideoUrl = request?.url?.toString()
                                                        isEyeActive = true
                                                    }
                                                }
                                                return super.shouldInterceptRequest(view, request)
                                            }

                                            override fun onPageFinished(view: WebView?, url: String?) {
                                                super.onPageFinished(view, url)
                                                if (url != null) {
                                                    tab.url = url
                                                    tab.title = view?.title ?: "تب جدید"
                                                    if (isVisible) {
                                                        urlInput = url
                                                    }
                                                }
                                            }
                                        }
                                        loadUrl(tab.url)
                                        tab.webView = this
                                    }
                                },
                                update = { view ->
                                    if (!isVisible) {
                                        view.visibility = android.view.View.GONE
                                    } else {
                                        view.visibility = android.view.View.VISIBLE
                                        urlInput = tab.url
                                    }
                                }
                            )
                        }
                    }
                }
            }
        }

        @Composable
        fun DownloadsScreen() {
            val context = LocalContext.current

            Column(
                modifier = Modifier
                    .fillMaxSize()
                    .padding(16.dp),
                horizontalAlignment = Alignment.CenterHorizontally
            ) {
                Text("مدیریت دانلودهای فعال و دریافتی", fontSize = 18.sp, fontWeight = FontWeight.Bold)
                Spacer(modifier = Modifier.height(16.dp))

                Card(
                    modifier = Modifier.fillMaxWidth(),
                    colors = CardDefaults.cardColors(containerColor = Color(0xFFF1F5F9))
                ) {
                    Column(modifier = Modifier.padding(16.dp)) {
                        Text("مشاهده درصد پیشرفت و فایل‌ها", fontWeight = FontWeight.Bold, fontSize = 14.sp)
                        Spacer(modifier = Modifier.height(8.dp))
                        Text("برای مشاهده وضعیت پیشرفت یا باز کردن فایل دانلود شده، کلیک کنید:", fontSize = 12.sp, color = Color.Gray)

                        Spacer(modifier = Modifier.height(12.dp))
                        Button(
                            onClick = {
                                try {
                                    val intent = Intent(DownloadManager.ACTION_VIEW_DOWNLOADS)
                                    context.startActivity(intent)
                                } catch (e: Exception) {
                                    Toast.makeText(context, "بخش دانلود سیستم باز نشد", Toast.LENGTH_SHORT).show()
                                }
                            },
                            modifier = Modifier.fillMaxWidth()
                        ) {
                            Text("باز کردن پوشه دانلودهای گوشی")
                        }
                    }
                }
            }
        }

        @Composable
        fun SettingsScreen() {
            var selectedEngine by remember { mutableStateOf("گوگل") }
            val context = LocalContext.current

            Column(
                modifier = Modifier
                    .fillMaxSize()
                    .padding(16.dp)
            ) {
                Text("تنظیمات مرورگر OmniSaver", fontSize = 20.sp, fontWeight = FontWeight.Bold)
                Spacer(modifier = Modifier.height(20.dp))

                Text("موتور جستجو:", fontWeight = FontWeight.SemiBold)
                Row(verticalAlignment = Alignment.CenterVertically) {
                    RadioButton(selected = selectedEngine == "گوگل", onClick = { selectedEngine = "گوگل" })
                    Text("Google")
                    Spacer(modifier = Modifier.width(16.dp))
                    RadioButton(selected = selectedEngine == "بینگ", onClick = { selectedEngine = "بینگ" })
                    Text("Bing")
                }

                Divider(modifier = Modifier.padding(vertical = 16.dp))

                Button(
                    onClick = {
                        Toast.makeText(context, "حافظه کش پاکسازی شد", Toast.LENGTH_SHORT).show()
                    },
                    colors = ButtonDefaults.buttonColors(containerColor = Color(0xFFEF4444)),
                    modifier = Modifier.fillMaxWidth()
                ) {
                    Text("پاکسازی کش مرورگر")
                }
            }
        }

        fun startDownload(context: Context, videoUrl: String) {
            try {
                val cookies = CookieManager.getInstance().getCookie(videoUrl)
                val request = DownloadManager.Request(Uri.parse(videoUrl)).apply {
                    setTitle("OmniSaver_Video")
                    setDescription("در حال دریافت فایل اصلی...")
                    if (!cookies.isNullOrEmpty()) {
                        addRequestHeader("Cookie", cookies)
                    }
                    addRequestHeader("User-Agent", "Mozilla/5.0 (Linux; Android 10) AppleWebKit/537.36")
                    setNotificationVisibility(DownloadManager.Request.VISIBILITY_VISIBLE_NOTIFY_COMPLETED)
                    setDestinationInExternalPublicDir(Environment.DIRECTORY_DOWNLOADS, "OmniSaver_Video_${System.currentTimeMillis()}.mp4")
                }
                val manager = context.getSystemService(Context.DOWNLOAD_SERVICE) as DownloadManager
                manager.enqueue(request)
                Toast.makeText(context, "دانلود ویدیوی اصلی شروع شد! (نوار اعلانات را چک کنید)", Toast.LENGTH_LONG).show()
            } catch (e: Exception) {
                Toast.makeText(context, "خطا در شروع دانلود: ${e.message}", Toast.LENGTH_SHORT).show()
            }
        }
        EOF

    # ۶. تنظیم پسوورد و Alias کی‌استور
    - name: Override Keystore Credentials in Gradle
      run: |
        if [ -f "app/build.gradle.kts" ]; then
          sed -i 's/storePassword = .*/storePassword = "android123"/g' app/build.gradle.kts || true
          sed -i 's/keyPassword = .*/keyPassword = "android123"/g' app/build.gradle.kts || true
          sed -i 's/keyAlias = .*/keyAlias = "omni-key-alias"/g' app/build.gradle.kts || true
        elif [ -f "app/build.gradle" ]; then
          sed -i 's/storePassword .*/storePassword "android123"/g' app/build.gradle || true
          sed -i 's/keyPassword .*/keyPassword "android123"/g' app/build.gradle || true
          sed -i 's/keyAlias .*/keyAlias "omni-key-alias"/g' app/build.gradle || true
        fi

    # ۷. کامپایل نهایی
    - name: Build Release APK
      run: gradle assembleRelease --no-daemon

    # ۸. آپلود خروجی فایل
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: OmniSaver-Release-FixedVideo
        path: '**/build/outputs/apk/release/*.apk'
